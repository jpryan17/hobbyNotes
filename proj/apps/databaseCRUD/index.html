<!-- crud/index.html -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DB_CRUD</title>
        <style>
            body {
                font-family: sans-serif;
                display: flex;
                height: 100vh;
                margin: 0;
                overflow: hidden;
            }
            #main-content {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
            }
            #navigation-panel {
                border-bottom: 1px solid #ccc;
                padding: 10px;
            }
            #display-panel {
                flex-grow: 1;
                padding: 10px;
            }
            #status-area {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 10px;
                background-color: #333;
                color: white;
                font-family: monospace;
            }
            .status-error {
                color: #ff8a8a;
            }
            .status-success {
                color: #a2ffb3;
            }
            #navigation-panel button {
                display: block; /* Each button on a new line in sub-nav */
                width: 90%;
                margin: 4px auto;
                padding: 5px 10px;
                cursor: pointer;
                text-align: left;
            }
            /* Top level buttons can be inline again */
            #navigation-panel .nav-group-btn {
                display: inline-block;
                width: auto;
                margin-right: 8px;
            }
            #navigation-panel .list-ctrl-btn {
                display: inline-block;
                width: auto;
                margin-right: 8px;
            }

            .record-list {
                list-style: none;
                padding: 0;
            }
            .record-list li {
                padding: 8px;
                border-bottom: 1px solid #eee;
            }
            .record-list li:hover {
                background-color: #f0f0f0;
            }
            .form-container {
                margin-top: 20px;
                border: 1px solid #ccc;
                padding: 15px;
                border-radius: 5px;
            }
            .form-field {
                margin-bottom: 12px;
                display: flex;
                align-items: center;
            }
            .form-field label {
                font-weight: bold;
                width: 200px;
                padding-right: 10px;
            }
            .form-value {
                font-family: monospace;
                background-color: #f4f4f4;
                padding: 5px;
                border-radius: 3px;
            }
            .form-value.null-value {
                color: #888;
                font-style: italic;
            }
            .form-value.error-value {
                color: #c00;
                font-weight: bold;
            }
            #display-panel {
                flex-grow: 1;
                padding: 10px;
                overflow-y: auto; /* <<< THIS IS THE FIX */
            }
            .goto-link {
                cursor: pointer;
                color: blue;
                text-decoration: none;
                margin-left: 8px;
                font-weight: bold;
            }
            .goto-link:hover {
                text-decoration: underline;
            }
            .dependents-container {
                margin-top: 20px;
                border-top: 1px solid #eee;
                padding-top: 10px;
            }
            .dependents-container button {
                background-color: #e0e0e0;
                border: 1px solid #ccc;
                padding: 5px 10px;
                cursor: pointer;
                margin-right: 8px;
            }
            .dependents-container button:hover {
                background-color: #d0d0d0;
            }
            .add-new-btn {
                display: inline-block;
                width: auto;
                margin-bottom: 15px;
                background-color: #d4edda;
                border-color: #c3e6cb;
                font-weight: bold;
            }
            /* crud/index.html -> <style> */

            /* Add these new styles at the end of your existing CSS */

            .hint-container {
                position: relative; /* This is the anchor for the dropdown */
                display: flex; /* Aligns with your existing form layout */
                width: 100%;
            }

            .hint-dropdown {
                display: none; /* Hidden by default */
                position: absolute;
                top: 100%; /* Position it right below the input */
                left: 200px; /* Align with where the input starts (adjust if your label width changes) */
                background-color: white;
                border: 1px solid #ccc;
                border-top: none;
                max-height: 200px;
                overflow-y: auto;
                z-index: 1000; /* Ensure it appears above other elements */
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            .hint-item {
                padding: 8px 12px;
                cursor: pointer;
                font-family: sans-serif; /* Use a more readable font than monospace for hints */
                font-size: 14px;
                white-space: nowrap;
            }

            .hint-item:hover {
                background-color: #f0f0f0;
            }
            .form-field {
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                min-height: 32px; /* Give it a minimum height to prevent layout shifts */
            }

            .value-container {
                /* This container will hold our input/select/span */
                flex-grow: 1;
            }
            #status-area {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 40px; /* Give it an explicit height */
                padding: 10px;
                box-sizing: border-box; /* Ensures padding is included in the height */
                background-color: #333;
                color: white;
                font-family: monospace;
            }
            .modal-overlay {
                position: fixed; /* Sit on top of all other content */
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.6); /* Semi-transparent black background */
                display: none; /* Hidden by default */
                align-items: center;
                justify-content: center;
                z-index: 2000; /* High z-index to ensure it's on top */
            }

            .modal-content {
                background: white;
                padding: 20px;
                border-radius: 8px;
                width: 80%;
                max-width: 700px; /* Or a width you prefer */
                max-height: 80vh; /* Max height to prevent it from going off-screen */
                overflow-y: auto; /* Add a scrollbar if content is too tall */
                position: relative; /* Needed for positioning the close button */
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }

            .modal-close-btn {
                position: absolute;
                top: 10px;
                right: 15px;
                border: none;
                background: transparent;
                font-size: 24px;
                font-weight: bold;
                cursor: pointer;
                line-height: 1;
                padding: 0;
            }
            .modal-content button {
                /* Style for buttons inside the modal, like the "OK" button */
                display: block;
                margin-top: 20px;
                margin-left: auto; /* Align button to the right */
                padding: 8px 16px;
                border: 1px solid #ccc;
                background-color: #f0f0f0;
                border-radius: 4px;
                cursor: pointer;
            }
            .modal-content button:hover {
                background-color: #e0e0e0;
            }
            .form-field.is-required > label::after {
                content: ' *';
                color: #c00;
            }
        </style>
    </head>
    <body>
        <div id="main-content">
            <div id="navigation-panel"><h3>Navigation</h3></div>
            <div id="display-panel"><h3>Display</h3></div>
        </div>

        <div id="status-area">
            <p id="status-message">Initializing...</p>
        </div>
        <!-- ======================================================= -->
        <!--  modal block               -->
        <!-- ======================================================= -->
        <div id="main-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="modal-close-btn">×</button>
                <div id="modal-body">
                    <!-- Modal content will be dynamically rendered here -->
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
