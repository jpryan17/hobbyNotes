<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled</title>
  <style>
    :root {
      --text-main: #1e293b;
      --text-muted: #64748b;
      --heading-color: #0f172a;
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --accent-purple: #7c3aed;
      --accent-emerald: #059669;
      --bg-card: #f8fafc;
      --border-color: #e2e8f0;
      --border-accent: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.75;
      color: var(--text-main);
      background-color: #ffffff;
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px 80px 20px;
    }
    h1, h2, h3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--heading-color); }
    h1 { font-size: 2.2rem; font-weight: 800; margin: 0 0 8px 0; line-height: 1.25; }
    h1 .subtitle { display: block; font-size: 1.35rem; font-weight: 600; color: var(--primary); margin-top: 6px; }
    h2 { font-size: 1.4rem; color: var(--heading-color); margin-top: 38px; margin-bottom: 16px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    h3 { font-size: 1.18rem; color: var(--primary-dark); margin-top: 26px; margin-bottom: 12px; font-weight: 700; }
    svg { max-width: 100%; height: auto; display: block; margin: 16px auto; }
    sub { font-size: 0.8em; vertical-align: -0.25em; line-height: 0; }
    sub sub, sub.sub-sub { font-size: 0.72em; vertical-align: -0.36em; line-height: 0; }
    sup { font-size: 0.8em; vertical-align: 0.42em; line-height: 0; }
    sup sup, sup.sup-sup { font-size: 0.72em; vertical-align: 0.52em; line-height: 0; }
    .axiom-box { background: #eff6ff; border-left: 4px solid var(--primary); border-radius: 0 8px 8px 0; padding: 18px 22px; margin: 22px 0; font-size: 1.1rem; }
    .math-display { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px 18px; margin: 16px 0; text-align: center; font-size: 1.1rem; }
    .diagram-container { margin: 28px 0; padding: 16px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px; text-align: center; overflow-x: auto; }
  </style>
</head>
<body>
<font size="6">I know we talked in general about crud delete behavior, and two basic types of behavior checks. I think deletion of a DE illustrates the use cases nicely.</font><div><font size="6"><br></font></div><div><font size="6"><br></font><div><font size="6">&nbsp;</font></div></div>
</body>
</html>
